# Publishes the website/ folder to GitHub Pages whenever it changes.
#
# One-time setup in the repository: Settings > Pages > "Build and
# deployment" > Source: "GitHub Actions". The custom address comes from
# website/CNAME; see "Publishing" in docs/DEVELOPMENT.md for the DNS record.
name: Website

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
